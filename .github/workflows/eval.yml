name: Eval

# Offline eval gate. Runs only when prompts, the RAG path, safety components,
# or the golden dataset change. Fails the build when section citation accuracy
# < 0.85, language routing accuracy < 0.95, or decline accuracy < 0.95.
# No live LLM/embedding calls.
# Author: Al Amin Ahamed.

on:
  push:
    branches: [main, trunk]
    paths:
      - "apps/api/app/prompts/**"
      - "apps/api/app/rag/**"
      - "apps/api/eval/dataset/**"
  pull_request:
    paths:
      - "apps/api/app/prompts/**"
      - "apps/api/app/rag/**"
      - "apps/api/eval/dataset/**"

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: eval gate (citation >= 0.85, lang_routing >= 0.95, decline >= 0.95)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bdrag
          POSTGRES_PASSWORD: bdrag
          POSTGRES_DB: bdrag
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U bdrag -d bdrag"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BDRAG_DATABASE_DSN: postgresql+asyncpg://bdrag:bdrag@localhost:5432/bdrag
      BDRAG_REDIS_DSN: redis://localhost:6379/0
      BDRAG_ENVIRONMENT: development
      BDRAG_DECLINE_RECALL_FLOOR: "0.001"
      BDRAG_COST_CEILING_USD_PER_REQUEST: "100.0"
      BDRAG_COST_PER_1K_INPUT_USD: "0.0"
      BDRAG_COST_PER_1K_OUTPUT_USD: "0.0"
      BDRAG_COHERE_API_KEY: ""
      BDRAG_ANTHROPIC_API_KEY: ""
      BDRAG_OLLAMA_BASE_URL: "http://localhost:11434"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies
        run: cd apps/api && uv sync --frozen

      - name: Apply migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Seed golden dataset
        run: cd apps/api && uv run python -m app.seeders --fresh

      - name: Run eval harness (gates thresholds)
        run: cd apps/api && uv run python -m eval.harness
