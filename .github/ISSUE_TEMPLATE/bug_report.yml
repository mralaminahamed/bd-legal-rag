name: Bug report
description: Something is broken or producing wrong output
labels: [bug]
assignees: [mralaminahamed]

body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** check that the API is healthy (`GET /health`) and that
        the quality gates pass locally (`ruff`, `mypy`, `pytest`).

        If this is a security vulnerability, **do not open a public issue** — see
        [SECURITY.md](../SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Minimal steps, curl commands, or a failing test that demonstrates the issue.
      placeholder: |
        1. POST /api/v1/query/stream with body `{"question": "..."}`
        2. Expected: ...
        3. Got: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Ingestion (crawler / parser / embedder)
        - Retrieval (vector search / lexical search / reranker)
        - Generation (LLM provider / prompt / guardrails)
        - Safety (disclaimer / decline gate / citation)
        - API (FastAPI routes)
        - Admin console (React web app)
        - Database / migrations
        - Docker / infra
        - Other
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this one
          required: true
        - label: This is not a security vulnerability (see SECURITY.md)
          required: true
