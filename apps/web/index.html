<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BD Legal RAG</title>
    <meta
      name="description"
      content="Operator console for the Bangladesh Legal RAG — manage acts, trigger ingestion, inspect metrics, and test bilingual grounded answers."
    />
    <meta name="author" content="Al Amin Ahamed" />
    <!-- Internal operator tool — keep out of search engines -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Theme colors: light surface / dark nav sidebar -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f5fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1a2744" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon"   href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml"  href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png"      href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png"      href="/favicon-16.png" sizes="16x16" />

    <!-- Apple touch icon (iOS home screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web app manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnect to CDN for Tabler Icons -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Tabler Icons webfont — not an npm dep, loaded from jsDelivr -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"
    />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="BD Legal RAG" />
    <meta property="og:description" content="Operator console for the Bangladesh Legal RAG — bilingual statutory Q&A, acts management, and metrics." />
    <meta property="og:site_name"   content="BD Legal RAG" />
    <meta property="og:image"       content="/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="BD Legal RAG — Bangladesh statute law Q&A platform" />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="BD Legal RAG" />
    <meta name="twitter:description" content="Bilingual Bangladeshi statute law — RAG-powered Q&A and admin console." />
    <meta name="twitter:image"       content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
