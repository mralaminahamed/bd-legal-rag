<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>

  <!-- Logo mark — top left -->
  <g transform="translate(72, 72)">
    <!-- Icon background -->
    <rect width="88" height="88" rx="20" fill="rgba(99,102,241,0.2)"/>
    <rect width="88" height="88" rx="20" fill="none" stroke="rgba(99,102,241,0.4)" stroke-width="1.5"/>
    <!-- Scales beam -->
    <line x1="22" y1="30" x2="66" y2="30" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="30" x2="44" y2="64" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="33" y1="68" x2="55" y2="68" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <!-- Left pan -->
    <line x1="22" y1="30" x2="18" y2="47" stroke="rgba(255,255,255,0.75)" stroke-width="3" stroke-linecap="round"/>
    <path d="M11 47 Q18 55 25 47" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right pan -->
    <line x1="66" y1="30" x2="70" y2="47" stroke="rgba(255,255,255,0.75)" stroke-width="3" stroke-linecap="round"/>
    <path d="M63 47 Q70 55 77 47" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Node dot -->
    <circle cx="68" cy="17" r="5.5" fill="#818cf8"/>
    <circle cx="78" cy="27" r="4.5" fill="#6366f1"/>
    <line x1="68" y1="17" x2="78" y2="27" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Brand name -->
  <text x="178" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white" letter-spacing="-0.5">BD Legal RAG</text>
  <text x="178" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(148,163,184,1)" letter-spacing="2">ADMIN CONSOLE</text>

  <!-- Divider -->
  <line x1="72" y1="190" x2="600" y2="190" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Main headline -->
  <text x="72" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="700" fill="white" letter-spacing="-1">Bangladesh Legal</text>
  <text x="72" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="700" fill="url(#accent)" letter-spacing="-1">RAG Platform</text>

  <!-- Bengali subtitle -->
  <text x="72" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="rgba(148,163,184,0.9)">বাংলাদেশ আইন — গবেষণা ও প্রশ্নোত্তর সিস্টেম</text>

  <!-- Feature pills -->
  <g transform="translate(72, 460)">
    <!-- Pill 1 -->
    <rect width="200" height="40" rx="20" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#818cf8" font-weight="600">⚖  5 Acts indexed</text>
    <!-- Pill 2 -->
    <rect x="216" width="200" height="40" rx="20" fill="rgba(5,150,105,0.15)" stroke="rgba(5,150,105,0.3)" stroke-width="1"/>
    <text x="236" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#10b981" font-weight="600">⬡  Bilingual EN / BN</text>
    <!-- Pill 3 -->
    <rect x="432" width="190" height="40" rx="20" fill="rgba(217,119,6,0.15)" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
    <text x="452" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#f59e0b" font-weight="600">⚡  RAG + Ollama</text>
  </g>

  <!-- Right side: decorative scales -->
  <g transform="translate(760, 100)" opacity="0.15">
    <line x1="120" y1="80" x2="360" y2="80" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <line x1="240" y1="80" x2="240" y2="320" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <line x1="168" y1="332" x2="312" y2="332" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <line x1="120" y1="80" x2="88" y2="196" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <path d="M44 196 Q88 248 132 196" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
    <line x1="360" y1="80" x2="392" y2="196" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <path d="M348 196 Q392 248 436 196" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right side: glowing node graph -->
  <circle cx="980" cy="180" r="40" fill="#6366f1" opacity="0.2"/>
  <circle cx="980" cy="180" r="24" fill="#6366f1" opacity="0.5"/>
  <circle cx="1100" cy="300" r="30" fill="#818cf8" opacity="0.2"/>
  <circle cx="1100" cy="300" r="18" fill="#818cf8" opacity="0.5"/>
  <circle cx="920" cy="360" r="22" fill="#4338ca" opacity="0.3"/>
  <circle cx="920" cy="360" r="13" fill="#4338ca" opacity="0.6"/>
  <line x1="980" y1="180" x2="1100" y2="300" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
  <line x1="980" y1="180" x2="920" y2="360" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
  <line x1="1100" y1="300" x2="920" y2="360" stroke="#818cf8" stroke-width="1.5" opacity="0.2"/>
</svg>
