<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0f1f42"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Shapla — 5 petals at 72° intervals (scaled 16× from 32px base) -->
  <g transform="translate(256,256)">
    <path d="M0,-40 C45,-64 45,-128 0,-176 C-45,-128 -45,-64 0,-40 Z" fill="rgba(255,255,255,0.92)"/>
    <path d="M0,-40 C45,-64 45,-128 0,-176 C-45,-128 -45,-64 0,-40 Z" fill="rgba(255,255,255,0.82)" transform="rotate(72)"/>
    <path d="M0,-40 C45,-64 45,-128 0,-176 C-45,-128 -45,-64 0,-40 Z" fill="rgba(255,255,255,0.88)" transform="rotate(144)"/>
    <path d="M0,-40 C45,-64 45,-128 0,-176 C-45,-128 -45,-64 0,-40 Z" fill="rgba(255,255,255,0.82)" transform="rotate(216)"/>
    <path d="M0,-40 C45,-64 45,-128 0,-176 C-45,-128 -45,-64 0,-40 Z" fill="rgba(255,255,255,0.88)" transform="rotate(288)"/>
  </g>

  <!-- Center — indigo accent -->
  <circle cx="256" cy="256" r="48" fill="#6366f1"/>
  <circle cx="256" cy="256" r="22" fill="white" fill-opacity="0.85"/>
</svg>
