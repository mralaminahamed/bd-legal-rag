<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Scales beam — wider for better balance -->
  <line x1="80" y1="176" x2="432" y2="176" stroke="rgba(255,255,255,0.9)" stroke-width="22" stroke-linecap="round"/>

  <!-- Pivot — indigo accent at fulcrum -->
  <circle cx="256" cy="176" r="40" fill="#6366f1"/>
  <circle cx="256" cy="176" r="18" fill="white" fill-opacity="0.75"/>

  <!-- Center post -->
  <line x1="256" y1="216" x2="256" y2="392" stroke="rgba(255,255,255,0.85)" stroke-width="20" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="176" y1="392" x2="336" y2="392" stroke="rgba(255,255,255,0.85)" stroke-width="22" stroke-linecap="round"/>

  <!-- Left chain + pan -->
  <line x1="80" y1="176" x2="64" y2="296" stroke="rgba(255,255,255,0.6)" stroke-width="18" stroke-linecap="round"/>
  <path d="M24 296 Q64 352 104 296" stroke="rgba(255,255,255,0.9)" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Right chain + pan -->
  <line x1="432" y1="176" x2="448" y2="296" stroke="rgba(255,255,255,0.6)" stroke-width="18" stroke-linecap="round"/>
  <path d="M408 296 Q448 352 488 296" stroke="rgba(255,255,255,0.9)" stroke-width="22" fill="none" stroke-linecap="round"/>
</svg>
