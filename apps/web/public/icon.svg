<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#233468"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Scales beam -->
  <line x1="128" y1="176" x2="384" y2="176" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <!-- Center post -->
  <line x1="256" y1="176" x2="256" y2="380" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <!-- Base platform -->
  <line x1="192" y1="396" x2="320" y2="396" stroke="white" stroke-width="24" stroke-linecap="round"/>

  <!-- Left pan chain -->
  <line x1="128" y1="176" x2="104" y2="284" stroke="rgba(255,255,255,0.8)" stroke-width="20" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M64 284 Q104 340 144 284" stroke="white" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- Right pan chain -->
  <line x1="384" y1="176" x2="408" y2="284" stroke="rgba(255,255,255,0.8)" stroke-width="20" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M368 284 Q408 340 448 284" stroke="white" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- RAG knowledge-graph nodes — top right -->
  <circle cx="400" cy="88" r="32" fill="#818cf8"/>
  <circle cx="468" cy="152" r="26" fill="#6366f1"/>
  <line x1="400" y1="88" x2="468" y2="152" stroke="#818cf8" stroke-width="18" stroke-linecap="round"/>
  <circle cx="400" cy="88" r="14" fill="white" opacity="0.9"/>
</svg>
