<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0f1f42"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Shapla — 5 petals at 72° intervals -->
  <g transform="translate(16,16)">
    <path d="M0,-2.5 C2.8,-4 2.8,-8 0,-11 C-2.8,-8 -2.8,-4 0,-2.5 Z" fill="rgba(255,255,255,0.92)"/>
    <path d="M0,-2.5 C2.8,-4 2.8,-8 0,-11 C-2.8,-8 -2.8,-4 0,-2.5 Z" fill="rgba(255,255,255,0.82)" transform="rotate(72)"/>
    <path d="M0,-2.5 C2.8,-4 2.8,-8 0,-11 C-2.8,-8 -2.8,-4 0,-2.5 Z" fill="rgba(255,255,255,0.88)" transform="rotate(144)"/>
    <path d="M0,-2.5 C2.8,-4 2.8,-8 0,-11 C-2.8,-8 -2.8,-4 0,-2.5 Z" fill="rgba(255,255,255,0.82)" transform="rotate(216)"/>
    <path d="M0,-2.5 C2.8,-4 2.8,-8 0,-11 C-2.8,-8 -2.8,-4 0,-2.5 Z" fill="rgba(255,255,255,0.88)" transform="rotate(288)"/>
  </g>

  <!-- Center — indigo accent -->
  <circle cx="16" cy="16" r="3" fill="#6366f1"/>
  <circle cx="16" cy="16" r="1.4" fill="white" fill-opacity="0.85"/>
</svg>
